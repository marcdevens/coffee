<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coffee">
<title>Coffee</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f6efe6;
    --surface: #fffaf4;
    --surface-2: #efe4d6;
    --text: #2a1d16;
    --muted: #7a6656;
    --line: #e2d4c3;
    --accent: #8a4b2a;
    --accent-ink: #fffaf4;
    --accent-soft: #f1dccb;
    --shadow: 0 1px 2px rgba(60, 35, 20, .06), 0 4px 16px rgba(60, 35, 20, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1512;
      --surface: #261e1a;
      --surface-2: #31261f;
      --text: #f3e9df;
      --muted: #b09d8d;
      --line: #3d3029;
      --accent: #e0a073;
      --accent-ink: #1b1512;
      --accent-soft: #3d2a1f;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 48px; margin-bottom: 12px;
  }
  h1 { font: 700 26px/1.1 ui-serif, "New York", Georgia, serif; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 4px 8px; }
  .back {
    background: none; border: 0; padding: 8px 8px 8px 0; color: var(--accent); font-weight: 600;
    display: inline-flex; align-items: center; gap: 4px; min-height: 44px;
  }

  /* Picker */
  .methods { display: grid; gap: 12px; }
  .method {
    display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px;
    box-shadow: var(--shadow); transition: transform .08s ease;
  }
  .method:active { transform: scale(.98); }
  .method .ico { width: 52px; height: 52px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border-radius: 14px; flex: none; }
  /* IconOven (MIT) line icons */
  .method .ico svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .method .name { font-weight: 700; font-size: 20px; }
  .method .chev { margin-left: auto; color: var(--muted); font-size: 22px; }

  /* Calculator */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  .field + .field { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .field label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 48px; height: 48px; flex: none; border-radius: 14px; border: 0; background: var(--surface-2);
    font-size: 24px; font-weight: 500; line-height: 1; color: var(--accent);
  }
  .stepper button:active { background: var(--accent-soft); }
  .num {
    flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: center; gap: 6px;
    background: var(--bg); border-radius: 14px; height: 56px; padding: 0 12px;
  }
  .num input {
    width: 100%; min-width: 0; border: 0; background: none; text-align: right; outline: none;
    font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0; height: 56px;
  }
  .num .unit { font-size: 17px; color: var(--muted); flex: none; width: 2.2em; }
  .sub { font-size: 14px; color: var(--muted); text-align: right; padding-right: 68px; margin-top: 6px; min-height: 1.2em; }

  .grind-card { margin-top: 16px; padding: 12px 14px; }
  .grind { display: flex; align-items: center; gap: 12px; }
  .grind .big {
    font: 800 24px/1 ui-rounded, -apple-system, sans-serif; font-variant-numeric: tabular-nums;
    background: var(--accent); color: var(--accent-ink); border-radius: 12px; width: 48px; height: 48px;
    display: grid; place-items: center; flex: none;
  }
  .grind .what { font-weight: 600; font-size: 16px; }
  .grind .detail { color: var(--muted); font-size: 14px; }
  .tip { font-size: 13px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .tip b { color: var(--text); font-weight: 600; }

  ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
  ol.steps li { counter-increment: s; position: relative; padding: 0 0 0 44px; min-height: 30px; }
  ol.steps li + li { margin-top: 14px; }
  ol.steps li::before {
    content: counter(s); position: absolute; left: 0; top: -1px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 15px; display: grid; place-items: center;
  }
  ol.steps strong { font-variant-numeric: tabular-nums; }

  .fixed { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center; }
  .fixed .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fixed .k { font-size: 14px; color: var(--muted); font-weight: 600; }

  .timer { text-align: center; }
  .timer .phase { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .timer .clock { font: 800 64px/1.1 ui-rounded, -apple-system, sans-serif; font-variant-numeric: tabular-nums; margin: 4px 0; }
  .timer .next { color: var(--muted); font-size: 15px; min-height: 1.4em; }
  .timer.alert .clock, .timer.alert .phase { color: var(--accent); }
  .btn {
    width: 100%; height: 52px; border-radius: 14px; border: 0; margin-top: 14px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px;
  }
  .btn.secondary { background: var(--surface-2); color: var(--text); }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .note { font-size: 14px; color: var(--muted); margin: 10px 4px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <main id="home">
    <header>
      <h1>Coffee</h1>
    </header>
    <div class="methods">
      <button class="method" data-go="drip">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.75 2.75h14.5a2 2 0 0 1 2 2v3.5h-12v10.5h12v2.5H4.75a2 2 0 0 1-2-2V4.75a2 2 0 0 1 2-2"/><path d="M12.75 11h4.75q1 0 .86.99l-.47 3.27q-.14.99-1.14.99H13.5q-1 0-1.14-.99l-.47-3.27q-.14-.99.86-.99"/></svg></span>
        <span class="name">Drip</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <button class="method" data-go="press">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 2.75H13m-2.25 0v4.5"/><rect width="11" height="14" x="5.25" y="7.25" rx="2"/><path d="M5.25 12.5h11m0-2.75h2a2 2 0 0 1 2 2v4.5a2 2 0 0 1-2 2h-2"/></svg></span>
        <span class="name">French Press</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <button class="method" data-go="moka">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10.5 2.75h3m-5.25 3h7.5q1 0 .78.97l-1.06 4.56q-.22.97-.06 1.96l1.18 7.02q.16.99-.84.99h-7.5q-1 0-.84-.99l1.18-7.02q.16-.99-.06-1.96L7.47 6.72q-.22-.97.78-.97m.5 6.5h6.5"/><path d="M16.4 7.25h2.85L18 12.75M7.6 7.25l-2.35-1.5"/></svg></span>
        <span class="name">Moka Pot</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <button class="method" data-go="pourover">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.75 3.75h14.5l-3 7.5h-8.5z"/><path d="M9.5 6.25l.75 2.5m4.25-2.5l-.75 2.5"/><path d="M5.75 13.25h12.5"/><path d="M7.25 13.25v4.5a3 3 0 0 0 3 3h3.5a3 3 0 0 0 3-3v-4.5m0 1.5h.75a1.75 1.75 0 0 1 0 3.5h-.75"/></svg></span>
        <span class="name">Pourover</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
    </div>
  </main>

  <main id="calc" hidden></main>
</div>

<script>
(() => {
  const OZ = 28.3495;          // grams per (weight) ounce
  const CUP = 5 * OZ;          // a drip carafe "cup" = 5 oz

  const METHODS = {
    drip:  { name: 'Drip', ratio: 16, grind: 28, water: 4 * CUP },
    pourover: { name: 'Pourover', ratio: 16, grind: 24, water: 320 },
    press: { name: 'French Press', ratio: 15, grind: 34, water: 20 * OZ },
    moka:  { name: 'Moka Pot', grind: 15, fixed: true, water: 300, coffee: 25 },
  };

  // ---- persisted state ----
  const KEY = 'coffee-v1';
  // Encore ESP output speeds up as the grind gets coarser: ~1.3 g/s at setting 10, ~2.2 g/s at 30 (retailer specs)
  const grindRate = (setting) => Math.min(2.4, Math.max(1.2, 1.3 + (setting - 10) * 0.045));
  const state = { drip: {}, pourover: {}, press: {} };
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  for (const id of ['drip', 'pourover', 'press']) {
    state[id] = Object.assign({ water: METHODS[id].water, ratio: METHODS[id].ratio }, state[id]);
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  // ---- formatting ----
  const round = (n, d) => { const f = 10 ** d; return Math.round(n * f) / f; };
  // grams everywhere, with ounces as the secondary readout
  const toInput = (g, kind) => String(round(g, kind === 'water' ? 0 : 1));
  const fmt = (g, kind) => toInput(g, kind) + 'g';
  const oz = (g, d) => `${round(g / OZ, d)}oz`;
  const cupsText = (g) => { const c = round(g / CUP, 1); return c + (c === 1 ? ' cup' : ' cups'); };
  const secs = (g, setting) => Math.max(1, Math.round(g / grindRate(setting)));

  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { cameFromHome = true; location.hash = go.dataset.go; }
  });

  // ---- routing ----
  const home = document.getElementById('home');
  const calc = document.getElementById('calc');
  let cleanup = null;
  let cameFromHome = false;
  function route() {
    if (cleanup) { cleanup(); cleanup = null; }
    const id = location.hash.slice(1);
    if (!METHODS[id]) { cameFromHome = false; calc.hidden = true; home.hidden = false; document.title = 'Coffee'; return; }
    home.hidden = true; calc.hidden = false;
    document.title = METHODS[id].name + ' · Coffee';
    if (id === 'moka') renderMoka(); else renderCalc(id);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  const headerHTML = (name) => `
    <header>
      <button class="back" type="button" data-back>‹ Methods</button>
    </header>
    <h1>${name}</h1>`;

  const grindHTML = (setting, detail, tip) => `
    <div class="card grind-card">
      <div class="grind">
        <div class="big">${setting}</div>
        <div>
          <div class="what">Grinder setting</div>
          <div class="detail" id="grind-detail">${detail}</div>
        </div>
      </div>
      ${tip ? `<div class="tip">${tip}</div>` : ''}
    </div>`;
  calc.addEventListener('click', (e) => {
    // go back if we got here from the picker, otherwise (opened directly on #drip) just clear the hash
    if (e.target.closest('[data-back]')) cameFromHome ? history.back() : (location.hash = '');
  });

  const stepperHTML = (key, label) => `
    <div class="field">
      <label for="in-${key}">${label}</label>
      <div class="stepper">
        <button type="button" data-step="${key}" data-dir="-1" aria-label="Less ${label.toLowerCase()}">−</button>
        <div class="num">
          <input id="in-${key}" inputmode="decimal" enterkeyhint="done" autocomplete="off">
          <span class="unit" data-unit-label="${key}"></span>
        </div>
        <button type="button" data-step="${key}" data-dir="1" aria-label="More ${label.toLowerCase()}">+</button>
      </div>
      <div class="sub" id="sub-${key}"></div>
    </div>`;

  // ---- drip & french press ----
  function renderCalc(id) {
    const m = METHODS[id];
    const s = state[id];
    const isDrip = id === 'drip';

    calc.innerHTML = headerHTML(m.name) + grindHTML(m.grind, '', GRIND_TIPS[id]) + `
      <h2>Amounts</h2>
      <div class="card">
        ${isDrip
          ? stepperHTML('cups', 'Carafe cups') + stepperHTML('coffee', 'Coffee')
          : stepperHTML('water', 'Water') + stepperHTML('coffee', 'Coffee') + stepperHTML('ratio', 'Ratio (water per 1 coffee)')}
      </div>

      ${isDrip ? '' : `
      <h2>Timer</h2>
      <div class="card timer" id="timer">
        <div class="phase" id="t-phase">Ready</div>
        <div class="clock" id="t-clock">0:30</div>
        <div class="next" id="t-next">30s bloom, then 4min steep</div>
        <div class="row">
          <button class="btn" type="button" id="t-start">Start</button>
          <button class="btn secondary" type="button" id="t-reset" hidden>Reset</button>
        </div>
      </div>`}

      <h2>Steps</h2>
      <div class="card"><ol class="steps" id="steps"></ol></div>
    `;

    const $ = (sel) => calc.querySelector(sel);
    const inputs = { water: $('#in-water'), coffee: $('#in-coffee'), ratio: $('#in-ratio'), cups: $('#in-cups') };

    const coffee = () => s.water / s.ratio;
    const val = {
      water:  () => toInput(s.water, 'water'),
      coffee: () => toInput(coffee(), 'coffee'),
      ratio:  () => String(round(s.ratio, 1)),
      cups:   () => String(round(s.water / CUP, 1)),
    };

    function paint(except) {
      for (const k in inputs) if (inputs[k] && k !== except) inputs[k].value = val[k]();
      calc.querySelectorAll('[data-unit-label]').forEach(el => {
        const k = el.dataset.unitLabel;
        el.textContent = k === 'ratio' ? '' : k === 'cups' ? 'cups' : 'g';
      });
      $('#sub-coffee').textContent = oz(coffee(), 2);
      if (isDrip) $('#sub-cups').textContent = `${oz(s.water, 0)} water`;
      else {
        $('#sub-water').textContent = oz(s.water, 1);
        $('#sub-ratio').textContent = s.ratio < 14 ? 'Very strong' : s.ratio < 15 ? 'Strong' : s.ratio <= 17 ? 'Standard' : s.ratio <= 18 ? 'Light' : 'Very light';
      }

      $('#grind-detail').textContent = `Grind about ${secs(coffee(), m.grind)}s`;
      $('#steps').innerHTML = STEPS[id](s.water, coffee()).map(t => `<li>${t}</li>`).join('');
      if (resetTimer) resetTimer();
      save();
    }

    function set(key, g) {
      if (key === 'water') s.water = g;
      else if (key === 'coffee') s.water = g * s.ratio;
      else if (key === 'cups') s.water = g * CUP;
      else if (key === 'ratio') s.ratio = g;
      s.water = Math.min(Math.max(s.water, 30), 4000);
      s.ratio = Math.min(Math.max(s.ratio, 8), 25);
    }

    for (const k in inputs) {
      const el = inputs[k];
      if (!el) continue;
      el.addEventListener('input', () => {
        const raw = parseFloat(el.value.replace(',', '.'));
        if (!(raw > 0)) return;
        set(k, raw);
        paint(k);
      });
      el.addEventListener('blur', () => paint());
      el.addEventListener('focus', () => el.select());
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.blur(); });
    }

    calc.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.step, dir = +b.dataset.dir;
      if (k === 'cups') set('cups', Math.max(1, Math.round(s.water / CUP) + dir));
      else if (k === 'ratio') set('ratio', round(s.ratio + dir * 0.5, 1));
      else if (k === 'water') set('water', (Math.round(s.water / 25) + dir) * 25);
      else if (k === 'coffee') set('coffee', Math.max(1, Math.round(coffee()) + dir));
      paint();
    }));

    let resetTimer = null;
    if (!isDrip) ({ cleanup, refresh: resetTimer } = setupTimer(() => TIMERS[id](s.water, coffee())));
    paint();
  }

  const GRIND_TIPS = {
    drip: '',  // OXO Barista Brain takes flat-bottom basket filters; 28 suits it
    pourover: `Draining past ~3:30 or tastes bitter? Go coarser, <b>26–27</b>. Done before 3:00 or tastes sour? Go finer, <b>21–22</b>.`,
    press: `Muddy or silty cup? Go coarser, <b>36–38</b>. Thin or sour? Try <b>32</b>.`,
  };

  const dripSteps = (water, coffee) => [
    `Fill the reservoir to <strong>${cupsText(water)}</strong> on the carafe (${oz(water, 0)}).`,
    `Grind <strong>${fmt(coffee, 'coffee')}</strong> on setting <strong>28</strong>, about <strong>${secs(coffee, 28)}s</strong>.`,
    `Put a filter in the basket, add the grounds, and give it a shake to level the bed.`,
    `Start the brew.`,
  ];

  const pressSteps = (water, coffee) => {
    const bloom = Math.min(water, coffee * 2);
    return [
      `Heat water to ~<strong>200°F</strong> (boil, then wait about 30s).`,
      `Grind <strong>${fmt(coffee, 'coffee')}</strong> on setting <strong>34</strong> (about ${secs(coffee, 34)}s) and add to the press.`,
      `Start the timer. Pour <strong>${fmt(bloom, 'water')}</strong> to bloom, making sure all the grounds are wet. Wait 30s.`,
      `Pour the remaining <strong>${fmt(water - bloom, 'water')}</strong> (total <strong>${fmt(water, 'water')}</strong>). Lid on, plunger up. Steep <strong>4min</strong>.`,
      `Stir to break the crust and skim off the foam. Press slowly (~20s) and pour it all right away so it stops brewing.`,
    ];
  };

  // Pourover (Kalita Wave) pours: bloom at 2.5× coffee, then pulse to ~45%, ~70% and 100% of the water
  const pouroverPours = (water, coffee) => {
    const bloom = Math.min(water, coffee * 2.5);
    return { bloom, p2: Math.max(bloom, water * 0.45), p3: water * 0.7, total: water };
  };

  const pouroverSteps = (water, coffee) => {
    const p = pouroverPours(water, coffee);
    return [
      `Heat water to ~<strong>205°F</strong> (just off the boil).`,
      `Put a Wave filter in the dripper and rinse it with hot water, pouring into the center so the ridges don't flatten. Dump the rinse water.`,
      `Grind <strong>${fmt(coffee, 'coffee')}</strong> on setting <strong>24</strong> (about ${secs(coffee, 24)}s). Add to the filter and shake it level.`,
      `Start the timer. Pour <strong>${fmt(p.bloom, 'water')}</strong> in a slow spiral to wet all the grounds. Wait 45s.`,
      `Pour in slow circles in the middle, keeping off the paper: up to <strong>${fmt(p.p2, 'water')}</strong> at 0:45, <strong>${fmt(p.p3, 'water')}</strong> at 1:15, and <strong>${fmt(p.total, 'water')}</strong> at 1:45. These are totals on the scale.`,
      `Let it drain. It should finish around <strong>3:00–3:30</strong>. Swirl and serve.`,
    ];
  };

  const STEPS = { drip: dripSteps, pourover: pouroverSteps, press: pressSteps };

  const TIMERS = {
    press: () => ({
      idle: '30s bloom, then 4min steep',
      phases: [
        { label: 'Bloom', secs: 30, next: 'Then pour the rest of the water' },
        { label: 'Steep', secs: 240, next: 'Then stir, skim and press' },
      ],
      done: ['Press', 'Stir, skim, press slowly, and pour'],
    }),
    pourover: (water, coffee) => {
      const p = pouroverPours(water, coffee);
      return {
        idle: `Bloom, three pours, then drain · ~3:30`,
        phases: [
          { label: `Bloom · pour ${fmt(p.bloom, 'water')}`, secs: 45, next: `Next: pour to ${fmt(p.p2, 'water')}` },
          { label: `Pour to ${fmt(p.p2, 'water')}`, secs: 30, next: `Next: pour to ${fmt(p.p3, 'water')}` },
          { label: `Pour to ${fmt(p.p3, 'water')}`, secs: 30, next: `Next: pour to ${fmt(p.total, 'water')}` },
          { label: `Pour to ${fmt(p.total, 'water')}`, secs: 30, next: 'Then let it drain' },
          { label: 'Drawdown', secs: 75, next: 'Should finish around 3:00–3:30' },
        ],
        done: ['Done', 'Swirl and serve'],
      };
    },
  };

  // ---- brew timer (French press, pourover) ----
  function setupTimer(getPlan) {
    let plan = getPlan();
    let PHASES = plan.phases;
    const box = calc.querySelector('#timer');
    const ph = calc.querySelector('#t-phase'), clock = calc.querySelector('#t-clock'), next = calc.querySelector('#t-next');
    const start = calc.querySelector('#t-start'), reset = calc.querySelector('#t-reset');
    let t0 = 0, idx = 0, tick = null, audio = null, lock = null;

    const mmss = (n) => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
    function beep(times) {
      if (navigator.vibrate) navigator.vibrate(times > 1 ? [200, 100, 200, 100, 400] : [250]);
      if (!audio) return;
      for (let i = 0; i < times; i++) {
        const o = audio.createOscillator(), g = audio.createGain();
        const at = audio.currentTime + i * 0.3;
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.3, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
        o.start(at); o.stop(at + 0.25);
      }
    }
    async function wake(on) {
      try {
        if (on && 'wakeLock' in navigator) lock = await navigator.wakeLock.request('screen');
        else if (!on && lock) { await lock.release(); lock = null; }
      } catch (e) {}
    }
    function stop() { clearInterval(tick); tick = null; wake(false); }
    function idle() {
      stop(); idx = 0; box.classList.remove('alert');
      plan = getPlan(); PHASES = plan.phases;
      ph.textContent = 'Ready'; clock.textContent = mmss(PHASES[0].secs);
      next.textContent = plan.idle;
      start.hidden = false; start.textContent = 'Start'; reset.hidden = true;
    }
    function update() {
      const p = PHASES[idx];
      const left = Math.max(0, Math.ceil(p.secs - (Date.now() - t0) / 1000));
      ph.textContent = p.label; clock.textContent = mmss(left); next.textContent = p.next;
      if (left > 0) return;
      if (idx < PHASES.length - 1) {
        idx++; t0 = Date.now(); beep(1); update();
      } else {
        stop(); beep(3); box.classList.add('alert');
        ph.textContent = 'Done'; clock.textContent = plan.done[0]; next.textContent = plan.done[1];
      }
    }
    start.addEventListener('click', () => {
      try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
      idx = 0; t0 = Date.now(); box.classList.remove('alert');
      plan = getPlan(); PHASES = plan.phases;
      start.hidden = true; reset.hidden = false;
      wake(true); update(); tick = setInterval(update, 250);
    });
    reset.addEventListener('click', idle);
    const onVis = () => { if (document.visibilityState === 'visible' && tick) { wake(true); update(); } };
    document.addEventListener('visibilitychange', onVis);
    idle();
    return {
      cleanup: () => { stop(); document.removeEventListener('visibilitychange', onVis); if (audio) audio.close(); },
      // amounts changed: update the idle readout, but never interrupt a running brew
      refresh: () => { if (!tick && !box.classList.contains('alert')) idle(); },
    };
  }

  // ---- moka pot (amounts fixed by the pot) ----
  function renderMoka() {
    const m = METHODS.moka;
    calc.innerHTML = headerHTML(m.name)
      + grindHTML(m.grind, `Grind about ${secs(m.coffee, m.grind)}s`, `Bitter or sputtering? Go coarser, <b>17–20</b>. Sour or thin? Go finer.`) + `
      <h2>6-cup Bialetti Moka Express</h2>
      <div class="card">
        <div class="fixed">
          <div><div class="v">~${m.water}ml</div><div class="k">Water, to just under the valve</div></div>
          <div><div class="v">~${fmt(m.coffee, 'coffee')}</div><div class="k">Coffee, a full level basket</div></div>
        </div>
        <div class="tip">The pot sets the amounts, so there's nothing to calculate. Makes ~240ml. Don't under-fill the basket to make less; it brews unevenly.</div>
      </div>

      <h2>Steps</h2>
      <div class="card"><ol class="steps">
        <li>Boil water. Fill the bottom chamber with the <strong>hot</strong> water to just below the valve. Starting hot keeps the grounds from cooking and tasting bitter or metallic.</li>
        <li>Grind <strong>~${fmt(m.coffee, 'coffee')}</strong> on setting <strong>${m.grind}</strong>. Fill the basket completely and level it with a finger. <strong>Don't press it down.</strong> Wipe any grounds off the rim.</li>
        <li>Drop in the basket and screw on the top, holding the base with a towel (it's hot).</li>
        <li>Heat on <strong>medium-low</strong> with the lid open so you can watch.</li>
        <li>When the coffee turns <strong>light brown</strong> and starts <strong>gurgling</strong>, take it off the heat and run the base under cold water to stop the brew.</li>
      </ol></div>
    `;
  }

  route();
})();
</script>
</body>
</html>
